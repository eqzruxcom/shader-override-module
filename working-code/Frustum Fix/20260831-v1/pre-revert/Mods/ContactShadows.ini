; LEFT-only contact-darkness fade; experimental, not release-ready.
; Starts with working donor contact shadows ON and fade 0%.
; 0 = no edge fade. Tests 1/2/3 reach full opacity at 3%/6%/9% from LEFT.
; All three start at zero opacity at the left edge; no inner dead zone.
; Keys 4..9 retain their previous width-only presets.
; Spatial opacity feather only: no blur, temporal history or fixed fade duration.
; Home toggles all added contact shadows. No native shadows, crop or FOV changed.
[Constants]
global $ue4fx_contact_edge_profile_v2 = 1
global $ue4fx_contact_edge_width_v2 = 0
global $ue4fx_contact_edge_cutoff_v2 = 0

[KeyUE4FXContactHome]
key = no_modifiers VK_HOME
type = cycle
smart = true
$ue4fx_contact_edge_profile_v2 = 0, 1

[KeyUE4FXContactEdge0]
