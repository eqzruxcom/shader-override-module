; Rebirth Effects DX11 shared runtime controls.
; These values occupy IniParams rows 100-103 to avoid the low rows commonly
; used by older Helix fixes. Replacement-shader glue will read them explicitly.

[Constants]
global $rebirth_ab_current = 1
; row 100: global light-fog disable (0 = normal, 1 = disabled), then grading values
x100 = 0.0
y100 = 0.0
z100 = 1.0
w100 = 0.18

; row 101: saturation, vibrance, gamma, tonemap mode
x101 = 1.0
y101 = 0.0
z101 = 1.0
w101 = 0.0

; row 102: tint RGB, reserved
x102 = 1.0
y102 = 1.0
z102 = 1.0
w102 = 0.0

; row 103: volumetric scattering, extinction/density, history weight, reserved
; Defaults reproduce the original ef7fe8d9c4e9ad15 compute pass.
x103 = 0.0
y103 = 1.0
z103 = 0.85
w103 = 0.0

[KeyRebirthEffectsToggle]
key = no_modifiers F6
type = cycle
x100 = 0.0, 1.0

[KeyRebirthTonemapMode]
key = no_modifiers F7
type = cycle
; none, Reinhard, Reinhard2, ACES 2015, ACES fitted,
; filmic, Uncharted 2, Unreal 3, Khronos Neutral
w101 = 0, 1, 2, 3, 4, 5, 6, 7, 8

; REDX11 ROLLING AB BEGIN
; F3 toggles Previous <-> Current instantly. The displayed side never affects promotion.
; Previous: ps Custom e2aa1c8cb39e0a55
; Current: ps Custom e2aa1c8cb39e0a55
[KeyRebirthRollingAB]
key = no_modifiers F3
type = cycle
smart = true
$rebirth_ab_current = 0, 1

[CustomShaderRebirthABPSMagenta]
ps = RebirthSolidColorProbe_ps.hlsl
blend = disable
handling = skip
draw = from_caller

[CustomShaderRebirthABPSZero]
ps = RebirthZeroProbe_ps.hlsl
blend = disable
handling = skip
draw = from_caller

[CustomShaderRebirthABCSMagenta]
cs = RebirthSolidColorProbe_cs.hlsl
handling = skip
draw = from_caller

[CustomShaderRebirthABCSZero]
cs = RebirthZeroProbe_cs.hlsl
handling = skip
draw = from_caller

[CustomShaderRebirthABPSCustom015C64F57322]
ps = RebirthABCustom_015C64F573226D8E_ps.hlsl
handling = skip
draw = from_caller

[ShaderOverrideRebirthABShared]
hash = e2aa1c8cb39e0a55
allow_duplicate_hash = true
if $rebirth_ab_current == 0
    run = CustomShaderRebirthABPSCustom015C64F57322
else
    run = CustomShaderRebirthABPSCustom015C64F57322
endif
; REDX11 ROLLING AB END
